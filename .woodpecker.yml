# Woodpecker CI — Wolfpack
#
# This is a firmware project, so the pipeline shape is:
#   CI  = "does it build, and do the host-native logic tests pass?"
#   CD  = basically nothing — firmware gets flashed to radios, not deployed.
#         The closest thing to a "deploy" is publishing a flashable .bin/.uf2
#         artifact (wired in below once the Meshtastic fork + Wolfpack module land).
#         The only piece that will ever deploy to a docker host is the future
#         dog-tracking web map.

when:
  - event: [push, pull_request]

steps:
  - name: repo-sanity
    image: alpine:3.20
    commands:
      - test -f WOLFPACK.md && echo "spec present"
      - test -f README.md && echo "readme present"
      - echo "Wolfpack repo OK — firmware build wires in here once the module lands."

