<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Wolfpack — team map &amp; timelapse</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<style>
  :root { --bg:#14171c; --panel:#1d222b; --ink:#e7ecf3; --muted:#8b94a3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
              font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  #map { flex:1; background:#0c0f14; }
  header { padding:8px 12px; background:var(--panel); display:flex; gap:14px;
           align-items:center; flex-wrap:wrap; border-bottom:1px solid #2a3140; }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.2px; }
  .badge { font-size:11px; color:#0c0f14; background:#f5c451; padding:2px 7px;
           border-radius:99px; font-weight:700; }
  .badge.live { background:#22c55e; }
  .badge.err  { background:#ff6b6b; }
  .legend { display:flex; gap:10px; margin-left:auto; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  footer { padding:8px 12px; background:var(--panel); border-top:1px solid #2a3140;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { background:#2b3340; color:var(--ink); border:1px solid #3a4350;
           border-radius:7px; padding:6px 12px; cursor:pointer; font-weight:600; }
  button:hover { background:#36404f; }
  button:disabled { opacity:.45; cursor:default; }
  #connect { background:#2f6f4f; border-color:#3d8a63; }
  #connect:hover { background:#38855e; }
  #scrub { flex:1; min-width:160px; }
  .clock { font-variant-numeric:tabular-nums; color:var(--muted); min-width:118px; }
  #alerts { color:#ff8d8d; font-weight:600; min-width:120px; }
  #spread { color:var(--muted); font-variant-numeric:tabular-nums; }
  #status { color:var(--muted); font-size:12px; flex-basis:100%; }
  #offline { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  select { background:#2b3340; color:var(--ink); border:1px solid #3a4350; border-radius:7px; padding:5px; }
  .leaflet-tooltip.lbl { background:rgba(20,23,28,.85); border:none; color:#fff;
           font-weight:700; font-size:11px; box-shadow:none; }
  .basepin { font-size:12px; font-weight:700; color:#fff; white-space:nowrap;
             background:rgba(20,23,28,.8); padding:2px 7px; border-radius:6px;
             border:1px solid #4a5568; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐺 Wolfpack — team map &amp; timelapse</h1>
    <button id="connect">Connect radio</button>
    <span class="badge" id="mode">MOCK DATA</span>
    <select id="region" title="Which riding area's map to show and save"></select>
    <button id="saveMap" title="Download this area's map, so the basemap works on the trail with no signal">⬇ Save map offline</button>
    <span id="offline"></span>
    <span class="legend" id="legend"></span>
  </header>
  <div id="map"></div>
  <footer>
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="0" value="0" />
    <span class="clock" id="clock">00:00 / 00:00</span>
    <select id="speed">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="4">4×</option>
    </select>
    <button id="export" disabled title="Download this ride as a GPX file — one track per radio">⬇ GPX</button>
    <span id="alerts"></span>
    <span id="spread"></span>
    <span id="status"></span>
  </footer>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="wolfpack-protocol.js"></script>
<script src="vendor/protomaps/protomaps-leaflet.js"></script>
<script src="wolfpack-offline.js"></script>
<script src="wolfpack-record.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Wolfpack phone map.
 *
 * Two data sources, one renderer:
 *   replay(ride)   — a scripted mock ride, no hardware (Phase A).
 *   connectLive()  — a real radio over Web Bluetooth (Phase B).
 *
 * Live mode samples the pack onto the same timeline the replay uses, so
 * the scrubber works on a live ride too: you get ride history and replay
 * for free rather than as a second feature.
 *
 * The live path reads the WOLFPACK BEACON, not stock position packets.
 * That matters: Meshtastic truncates native positions to the channel's
 * position_precision (13 bits ≈ 5.8 km cells) and rate-limits movement
 * broadcasts to one per 5 minutes. Our beacon is a PRIVATE_APP payload,
 * which is exempt from truncation, and it carries full-precision lat/lon
 * every few seconds. So this map sees better data than a generic client.
 * ------------------------------------------------------------------ */

const WP = window.WolfpackProtocol;

// The firmware's palette (enum WolfpackColor, rainbow order). Live teams
// come from the beacon, so all six exist whether or not they show up today.
const WP_PALETTE = {
  R: "#e6394a", O: "#f97316", Y: "#f5c451",
  G: "#22c55e", B: "#3b82f6", V: "#a855f7",
};

// The mock ride uses 4 of those 6 as xram's real skill groups.
const MOCK_TEAMS = {
  R: { name: "Beginner",     color: WP_PALETTE.R },
  Y: { name: "Intermediate", color: WP_PALETTE.Y },
  G: { name: "Proficient",   color: WP_PALETTE.G },
  B: { name: "Advanced",     color: WP_PALETTE.B },
};
const ROLES = ["Lead", "Mid", "Tail"];
const ROLE_RADIUS = { Lead: 9, Mid: 7, Tail: 6, Sweep: 6 };
const STALE = "#6b7280";

const STEP_SECONDS = 10, STEPS = 180;          // 30-min mock ride
const BASE = [40.0875, -75.0592];              // Pennypack Environmental Center

// Live tuning. WP_POS_STALE_MS in the firmware is 150 s — match it so the
// map greys a teammate out at the same moment their own HUD shows "?".
const LIVE_STEP_SECONDS = 5;
const LIVE_STALE_SECONDS = 150;
const LIVE_MAX_STEPS = (8 * 3600) / LIVE_STEP_SECONDS;   // a long day at the mountain
// Reconnect within this long and the recording carries on (the gap shows as
// a gap); longer, and it's a new ride. The old one stays saved either way.
const LIVE_RESUME_MS = 2 * 3600 * 1000;
const SAVE_EVERY_STEPS = 6;                               // 30 s
const HEARTBEAT_MS = 60000;

// per-skill petal: a loop that LEAVES the base, bulges out on its own
// bearing, and returns — so all 4 teams fan out from the one parking lot
// in different directions and converge back. Beginners stay close;
// advanced range farthest (and is the team that branches off-mesh).
const PROFILE = {
  R: { dir:  15, Ra: 0.0030, Rb: 0.0024 },   // Beginner — N-ish, closest
  Y: { dir: 105, Ra: 0.0048, Rb: 0.0039 },   // Intermediate — E-ish
  G: { dir: 200, Ra: 0.0066, Rb: 0.0054 },   // Proficient — SSW
  B: { dir: 300, Ra: 0.0084, Rb: 0.0069 },   // Advanced — WNW, farthest out
};
const LAG = { Lead: 0, Mid: 7, Tail: 16 };   // tail trails lead along the petal

// scripted events (step windows) to show off the states
const ADV_OUT = [60, 120];                     // Advanced branches out of mesh range
const INJURY  = ["R-Tail", 50, 100];           // Beginner tail hurt
const EQUIP   = ["G-Mid", 90, 140];            // Proficient mid mechanical

// --- helpers ---
const LNGS = 1.305;  // ~1/cos(40°): keep petals round-ish on the map at this lat
function petal(base, thetaDeg, Ra, Rb, a) {
  const th = thetaDeg * Math.PI / 180, ct = Math.cos(th), st = Math.sin(th);
  const out = -Math.cos(a) * Ra, side = Math.sin(a) * Rb;
  const lat = base[0] + Ra * ct + out * ct - side * st;
  const lng = base[1] + LNGS * (Ra * st + out * st + side * ct);
  return [lat, lng];
}
function haversine(a, b) {
  const R = 6371000, t = Math.PI / 180;
  const dLat = (b[0] - a[0]) * t, dLng = (b[1] - a[1]) * t;
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(s)));
}
function mmss(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function setStatus(msg) { document.getElementById("status").textContent = msg; }
function setMode(text, cls) {
  const el = document.getElementById("mode");
  el.textContent = text;
  el.className = "badge" + (cls ? " " + cls : "");
}

// --- build the mock ride ---
function buildMockRide() {
  const nodes = [];
  const TWO_PI = 2 * Math.PI;
  for (const k in MOCK_TEAMS) {
    const pr = PROFILE[k];
    for (const role of ROLES) {
      const id = k + "-" + role;
      const truePos = [];
      for (let i = 0; i < STEPS; i++) {
        let f = (i - LAG[role]) / (STEPS - 1 - LAG.Tail);
        f = f < 0 ? 0 : f > 1 ? 1 : f;
        truePos.push(petal(BASE, pr.dir, pr.Ra, pr.Rb, f * TWO_PI));
      }
      const heard = [];
      for (let i = 0; i < STEPS; i++) heard.push(!(k === "B" && i >= ADV_OUT[0] && i < ADV_OUT[1]));
      const status = [];
      for (let i = 0; i < STEPS; i++) {
        if (id === INJURY[0] && i >= INJURY[1] && i < INJURY[2]) status.push("injury");
        else if (id === EQUIP[0] && i >= EQUIP[1] && i < EQUIP[2]) status.push("equipment");
        else status.push(null);
      }
      const shown = [], age = [], lastHeard = [];
      let li = 0;
      for (let i = 0; i < STEPS; i++) {
        if (heard[i]) li = i;
        lastHeard.push(li);
        shown.push(truePos[li]);
        age.push((i - li) * STEP_SECONDS);
      }
      nodes.push({ id, short: k + "-" + role, team: k, role,
                   skill: MOCK_TEAMS[k].name, color: MOCK_TEAMS[k].color,
                   truePos, shown, age, status, lastHeard });
    }
  }
  return { nodes, teams: MOCK_TEAMS, steps: STEPS, stepSeconds: STEP_SECONDS, base: BASE };
}

// --- map ---
const map = L.map("map", { zoomControl: true });
// The basemap is our own file — an OpenStreetMap-derived PMTiles extract of
// one riding area, served from this origin. No tile CDN, no API key, and
// "save the map for the trail" is one download instead of crawling
// thousands of tiles. (The raster fallback is only for the node tests,
// which stub Leaflet and never load the renderer.)
const OFFLINE = window.WolfpackOffline;
let region = null, basemap = null, refreshSaved = () => {};

function setRegion(id, frame) {
  region = OFFLINE.region(id);
  try { localStorage.setItem("wolfpack-region", region.id); } catch (e) {}
  document.getElementById("region").value = region.id;
  if (basemap) basemap.remove();
  basemap = window.protomapsL.leafletLayer({
    url: region.path, flavor: "light", lang: "en",
    maxDataZoom: OFFLINE.MAX_DATA_ZOOM, attribution: OFFLINE.ATTRIBUTION,
  }).addTo(map);
  if (frame) map.fitBounds(region.bounds);
  refreshSaved();
}

if (window.protomapsL && OFFLINE) {
  const pick = document.getElementById("region");
  pick.innerHTML = OFFLINE.REGIONS.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  pick.addEventListener("change", () => setRegion(pick.value, true));
  let saved = null;
  try { saved = localStorage.getItem("wolfpack-region"); } catch (e) {}
  setRegion(saved);
} else {
  L.tileLayer("", { maxZoom: 19 }).addTo(map);
}

/** Live: the pack turned up somewhere — show that area's map if we have one. */
function followRegion(lat, lon) {
  const here = OFFLINE && OFFLINE.regionAt(lat, lon);
  if (here && here !== region) {
    setRegion(here.id, false);
    setStatus(`Switched to the ${here.name} map.`);
  }
}

let RIDE = null;
let layers = {};
let baseMarker = null;
let followPack = true;   // live: keep the pack in frame until the user pans

function buildLayers() {
  Object.values(layers).forEach(l => { l.marker.remove(); l.trail.remove(); });
  layers = {};
  if (baseMarker) { baseMarker.remove(); baseMarker = null; }

  const bounds = [];
  if (RIDE.base) {
    bounds.push(RIDE.base);
    baseMarker = L.marker(RIDE.base, { icon: L.divIcon({ className: "", html:
        '<div class="basepin">🏁 Base</div>', iconSize: [54, 18], iconAnchor: [27, 9] }) })
      .addTo(map);
  }

  RIDE.nodes.forEach(node => {
    const trail = L.polyline([], { color: node.color, weight: 2.5, opacity: 0.5 }).addTo(map);
    const marker = L.circleMarker(node.shown[node.shown.length - 1] || RIDE.base || [0, 0], {
      radius: ROLE_RADIUS[node.role] || 7, color: "#0c0f14", weight: 1.4,
      fillColor: node.color, fillOpacity: 0.9,
    }).addTo(map);
    if (node.role === "Lead") {
      marker.bindTooltip(node.skill || node.short, { permanent: true, direction: "right",
                                                     className: "lbl", offset: [7, 0] });
    } else {
      marker.bindTooltip(node.short, { direction: "top", className: "lbl" });
    }
    layers[node.id] = { marker, trail };
    node.truePos.forEach(p => { if (p) bounds.push(p); });
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });
}

/** Where the drawn trail begins: the last Start Ride, once the scrubber is past it. */
function trailStart(i) {
  return RIDE.trailFrom && i >= RIDE.trailFrom ? RIDE.trailFrom : 0;
}

function renderAt(i) {
  if (!RIDE || !RIDE.nodes.length) return;
  const alerts = [];
  const live = [];
  RIDE.nodes.forEach(node => {
    const l = layers[node.id];
    if (!l) return;
    const shown = node.shown[i], age = node.age[i], st = node.status[i], heard = age === 0;
    if (!shown) { l.marker.setStyle({ fillOpacity: 0, opacity: 0 }); return; }
    l.marker.setLatLng(shown);
    let stroke = "#0c0f14", weight = 1.4;
    if (st === "injury") { stroke = "#ff3b3b"; weight = 3; }
    else if (st === "equipment") { stroke = "#f5c451"; weight = 2.6; }
    else if (!heard) { stroke = "#9aa4b2"; weight = 1; }
    l.marker.setStyle({
      opacity: 1,
      fillColor: heard ? node.color : STALE, color: stroke, weight,
      fillOpacity: heard ? (node.role === "Lead" ? 0.95 : node.role === "Mid" ? 0.8 : 0.6) : 0.35,
    });
    const upto = node.truePos.slice(trailStart(i), node.lastHeard[i] + 1).filter(Boolean);
    l.trail.setLatLngs(upto);
    l.trail.setStyle({ opacity: heard ? 0.5 : 0.18 });
    if (node.role !== "Lead") {
      let tip = node.short + (node.skill ? " · " + node.skill : "") + " " + node.role;
      if (st) tip += "  ⚠ " + st;
      if (age > 0) tip += "  (" + age + "s ago)";
      l.marker.setTooltipContent(tip);
    }
    if (st) alerts.push("⚠ " + (node.skill || node.short) + " " + st.toUpperCase());
    live.push(shown);
  });

  // footer: spread per team (lead → sweep), or an out-of-range note
  const spreads = [];
  for (const k in RIDE.teams) {
    const lead = RIDE.nodes.find(n => n.team === k && n.role === "Lead");
    const back = RIDE.nodes.find(n => n.team === k && (n.role === "Tail" || n.role === "Sweep"));
    if (!lead || !back || !lead.shown[i] || !back.shown[i]) continue;
    const stale = RIDE.nodes.some(n => n.team === k && n.age[i] > 0);
    spreads.push(RIDE.teams[k].name + " " +
                 (stale ? "⚠out-of-range" : haversine(lead.shown[i], back.shown[i]) + "m"));
  }
  document.getElementById("clock").textContent =
    mmss(i * RIDE.stepSeconds) + " / " + mmss((RIDE.steps - 1) * RIDE.stepSeconds);
  document.getElementById("alerts").textContent = alerts.join("   ");
  document.getElementById("spread").textContent = spreads.join("  ·  ");

  if (RIDE.isLive && followPack && live.length) {
    map.fitBounds(L.latLngBounds(live).pad(0.35), { animate: false, maxZoom: 17 });
  }
}

function buildLegend() {
  const teams = RIDE ? RIDE.teams : MOCK_TEAMS;
  document.getElementById("legend").innerHTML = Object.keys(teams).map(p =>
    `<span><i class="dot" style="background:${teams[p].color}"></i>${teams[p].name}</span>`
  ).join("") + `<span><i class="dot" style="background:${STALE}"></i>out-of-range</span>`;
}

// --- timeline ---
const scrub = document.getElementById("scrub"), playBtn = document.getElementById("play");
let timer = null, pinnedToNow = true;
scrub.addEventListener("input", () => {
  pinnedToNow = RIDE && +scrub.value >= RIDE.steps - 1;
  renderAt(+scrub.value);
});
playBtn.addEventListener("click", () => timer ? stop() : play());
function play() {
  playBtn.textContent = "⏸ Pause";
  const inc = +document.getElementById("speed").value;
  timer = setInterval(() => {
    let v = +scrub.value + inc;
    if (v >= RIDE.steps) v = 0;
    scrub.value = v; renderAt(v);
  }, 200);
}
function stop() { clearInterval(timer); timer = null; playBtn.textContent = "▶ Play"; }
map.on("dragstart zoomstart", () => { followPack = false; });

// ================================================================== //
// LIVE: Web Bluetooth -> Wolfpack beacons -> the same timeline
// ================================================================== //

const Live = {
  device: null, gatt: null, toRadio: null, fromRadio: null, fromNum: null,
  peers: new Map(),        // nodeNum -> peer record
  startedAt: 0,
  timer: null, heartbeat: null,
  draining: false,

  reset() {
    this.peers.clear();
    this.startedAt = Date.now();
    RIDE = { nodes: [], teams: {}, steps: 1, stepSeconds: LIVE_STEP_SECONDS,
             base: null, isLive: true, startedAt: this.startedAt, times: [], trailFrom: 0 };
  },

  /** Is RIDE a recording we should keep adding to, rather than start over? */
  canContinue(now) {
    if (!RIDE || !RIDE.isLive || !RIDE.times || !RIDE.times.length) return false;
    return now - RIDE.times[RIDE.times.length - 1] < LIVE_RESUME_MS &&
           RIDE.times.length < LIVE_MAX_STEPS;
  },

  /** A beacon landed. Upsert the peer and remember the fix. */
  onBeacon(nodeNum, beacon, nowMs) {
    const code = WP.shortCode(beacon);
    let peer = this.peers.get(nodeNum);
    if (!peer) {
      peer = { id: "n" + nodeNum, num: nodeNum, short: code,
               team: WP.COLOR_LETTERS[beacon.color] || "?",
               role: WP.roleName(beacon.role),
               color: WP_PALETTE[WP.COLOR_LETTERS[beacon.color]] || "#9aa4b2",
               lastPos: null, lastPosMs: 0, rideEpoch: beacon.rideEpoch, isNew: true };
      this.peers.set(nodeNum, peer);
    }
    // A radio can be re-picked mid-ride; follow it rather than stranding a ghost.
    peer.short = code;
    peer.team = WP.COLOR_LETTERS[beacon.color] || "?";
    peer.role = WP.roleName(beacon.role);
    peer.color = WP_PALETTE[peer.team] || "#9aa4b2";

    // Start Ride: the lead stamped a new epoch. Start the trails fresh so
    // today's map doesn't inherit the last ride, exactly as the radios do —
    // but keep the recording; only the drawing starts over.
    if (beacon.rideEpoch !== WP.BEACON.RIDE_EPOCH_NONE && beacon.rideEpoch !== peer.rideEpoch) {
      peer.rideEpoch = beacon.rideEpoch;
      if (beacon.role === 1) this.startRide();
    }
    if (beacon.hasPosition) {
      peer.lastPos = [beacon.lat, beacon.lon];
      peer.lastPosMs = nowMs;
      if (!RIDE.base) {                       // first fix seen = the trailhead
        RIDE.base = peer.lastPos;
        followRegion(beacon.lat, beacon.lon);
      }
    }
  },

  startRide() {
    RIDE.trailFrom = RIDE.times.length;
    setStatus("Ride started — trails cleared. Everything before it is still in the recording.");
  },

  /** Snapshot every peer onto the shared timeline. Runs every LIVE_STEP_SECONDS. */
  sample() {
    if (!RIDE || !RIDE.isLive) return;
    const now = Date.now();
    let i = RIDE.times.length;
    if (i >= LIVE_MAX_STEPS) return;

    // Time the page wasn't sampling — screen off, Chrome frozen, Bluetooth
    // dropped — goes in as empty steps, so the scrubber and the GPX times
    // stay true to the clock instead of splicing the two sides together.
    const slot = Math.min(Math.floor((now - RIDE.startedAt) / (LIVE_STEP_SECONDS * 1000)),
                          LIVE_MAX_STEPS - 1);
    while (i < slot) {
      RIDE.times.push(RIDE.startedAt + i * LIVE_STEP_SECONDS * 1000);
      RIDE.nodes.forEach(n => {
        n.truePos.push(null); n.shown.push(n.shown[n.shown.length - 1] || null);
        n.age.push(9999); n.status.push(null); n.lastHeard.push(n.lastHeard[n.lastHeard.length - 1] || 0);
      });
      i++;
    }
    RIDE.times.push(now);

    let structureChanged = false;
    for (const peer of this.peers.values()) {
      let node = RIDE.nodes.find(n => n.id === peer.id);
      if (!node) {
        // Backfill so every node's arrays stay the same length as the timeline.
        node = { id: peer.id, short: peer.short, team: peer.team, role: peer.role,
                 skill: null, color: peer.color,
                 truePos: new Array(i).fill(null), shown: new Array(i).fill(null),
                 age: new Array(i).fill(0), status: new Array(i).fill(null),
                 lastHeard: new Array(i).fill(0) };
        RIDE.nodes.push(node);
        structureChanged = true;
      }
      node.short = peer.short; node.role = peer.role;
      node.team = peer.team; node.color = peer.color;
      if (!RIDE.teams[peer.team]) {
        RIDE.teams[peer.team] = { name: WP.colorName(WP.COLOR_LETTERS.indexOf(peer.team)),
                                  color: peer.color };
        structureChanged = true;
      }

      const ageSec = peer.lastPosMs ? Math.round((now - peer.lastPosMs) / 1000) : 9999;
      const fresh = peer.lastPos && ageSec <= LIVE_STALE_SECONDS;
      node.truePos.push(fresh ? peer.lastPos : null);
      node.shown.push(peer.lastPos);           // last known, even when stale
      node.age.push(fresh ? 0 : ageSec);
      node.status.push(null);
      node.lastHeard.push(node.truePos.length - 1);
    }
    // Any node that didn't get a row this tick (shouldn't happen, but keep
    // the arrays rectangular so renderAt can't read past an end).
    const len = Math.max(...RIDE.nodes.map(n => n.shown.length), i + 1);
    RIDE.nodes.forEach(n => {
      while (n.shown.length < len) {
        n.truePos.push(null); n.shown.push(n.shown[n.shown.length - 1] || null);
        n.age.push(9999); n.status.push(null); n.lastHeard.push(n.truePos.length - 1);
      }
      // lastHeard must point at the newest non-null fix, for the trail slice.
      let last = 0;
      for (let k = 0; k < n.truePos.length; k++) if (n.truePos[k]) last = k;
      n.lastHeard[n.lastHeard.length - 1] = last;
    });

    RIDE.steps = len;
    if (structureChanged) { buildLayers(); buildLegend(); }
    scrub.max = Math.max(0, RIDE.steps - 1);
    if (pinnedToNow) { scrub.value = RIDE.steps - 1; renderAt(RIDE.steps - 1); }
    if (RIDE.times.length % SAVE_EVERY_STEPS === 0) saveRide();
    updateExport();
  },

  /** Drain every queued FromRadio frame. One GATT read = one frame. */
  async drain() {
    if (this.draining) return;
    this.draining = true;
    try {
      for (let guard = 0; guard < 256; guard++) {
        const view = await this.fromRadio.readValue();
        if (!view || view.byteLength === 0) break;
        const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
        let pkt = null;
        try { pkt = WP.decodeFromRadio(bytes); }
        catch (e) { continue; }          // a malformed frame is not fatal
        if (!pkt) continue;
        if (pkt.encrypted) {
          setStatus("Heard an encrypted packet — this radio isn't on the pack's channel/PSK.");
          continue;
        }
        if (pkt.portnum !== WP.PORT_PRIVATE_APP) continue;
        const beacon = WP.parseBeacon(pkt.payload);
        if (beacon) this.onBeacon(pkt.from, beacon, Date.now());
      }
    } catch (e) {
      setStatus("Read failed: " + e.message);
    } finally {
      this.draining = false;
    }
  },

  async connect() {
    if (!navigator.bluetooth) {
      throw new Error("This browser has no Web Bluetooth. Use Chrome on Android — " +
                      "Safari/iOS does not support it.");
    }
    if (!window.isSecureContext) {
      throw new Error("Web Bluetooth needs HTTPS (or localhost). Serve this page over TLS.");
    }

    setStatus("Choose your radio…");
    this.device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [WP.BLE.SERVICE] }],
      optionalServices: [WP.BLE.SERVICE],
    });
    this.device.addEventListener("gattserverdisconnected", () => this.onDisconnect());

    setStatus("Connecting…");
    try {
      this.gatt = await this.device.gatt.connect();
      const svc = await this.gatt.getPrimaryService(WP.BLE.SERVICE);
      this.toRadio = await svc.getCharacteristic(WP.BLE.TORADIO);
      this.fromRadio = await svc.getCharacteristic(WP.BLE.FROMRADIO);
      this.fromNum = await svc.getCharacteristic(WP.BLE.FROMNUM);
    } catch (e) {
      // The usual cause: the radio is already talking to something else, and
      // it serves one client at a time. The browser's own error doesn't say so.
      throw new Error((e.message || String(e)) + " — if the radio is connected in Android's " +
                      "Bluetooth settings or the Meshtastic app, disconnect it there and try again.");
    }

    // A reconnect — or a reload that recovered a recent ride — carries on
    // recording into the same ride rather than wiping it.
    const resumed = this.canContinue(Date.now());
    if (!resumed) this.reset();

    // Handshake: ask for the config dump. The radio won't stream packets
    // until a client has identified itself this way.
    setStatus("Handshaking…");
    await this.toRadio.writeValue(WP.encodeWantConfig(Math.floor(Math.random() * 0x7fffffff)));
    await this.drain();   // swallow the config dump; beacons follow

    // fromNum notifies whenever there's something to read.
    await this.fromNum.startNotifications();
    this.fromNum.addEventListener("characteristicvaluechanged", () => this.drain());

    // Belt and braces: some stacks drop notifications, and an idle client
    // gets dropped by the radio, so poll and heartbeat as well.
    this.timer = setInterval(() => { this.drain(); this.sample(); }, LIVE_STEP_SECONDS * 1000);
    this.heartbeat = setInterval(() => {
      this.toRadio.writeValue(WP.encodeHeartbeat()).catch(() => {});
    }, HEARTBEAT_MS);

    followPack = true; pinnedToNow = true;
    setMode("LIVE", "live");
    setStatus("Connected to " + (this.device.name || "radio") + (resumed
      ? ". Still recording the same ride — the time you were away shows as a gap."
      : ". Recording — a teammate appears on their first fix."));
    buildLegend();
  },

  onDisconnect() {
    clearInterval(this.timer); clearInterval(this.heartbeat);
    this.timer = this.heartbeat = null;
    setMode("DISCONNECTED", "err");
    saveRide();
    setStatus("Radio disconnected. The ride so far is saved on this phone — " +
              "press Connect to keep recording.");
    document.getElementById("connect").disabled = false;
  },
};

// --- DATA SOURCE: the one seam between mock and real ---
const DataSource = {
  replay(ride) {
    RIDE = ride;
    scrub.max = RIDE.steps - 1; scrub.value = 0;
    buildLayers(); buildLegend(); renderAt(0);
  },
  async connectLive() {
    const btn = document.getElementById("connect");
    btn.disabled = true;
    try {
      stop();
      await Live.connect();
    } catch (e) {
      // A cancelled chooser is a user choice, not an error worth shouting about.
      if (e && e.name === "NotFoundError") setStatus("No radio picked.");
      else { setMode("ERROR", "err"); setStatus(e.message || String(e)); }
      btn.disabled = false;
    }
  },
};

document.getElementById("connect").addEventListener("click", () => DataSource.connectLive());

// --- keeping the ride: save to the phone as it records, GPX on demand ---
const RECORD = window.WolfpackRecord;
function saveRide() {
  if (RECORD && RIDE && RIDE.isLive) {
    RECORD.save(RIDE).catch(e => setStatus("Couldn't save the ride on this phone: " + e.message));
  }
}
function updateExport() {
  document.getElementById("export").disabled = !(RECORD && RIDE && RIDE.isLive && RECORD.hasFixes(RIDE));
}
document.getElementById("export").addEventListener("click", () => {
  saveRide();
  RECORD.download(RIDE);
});
// Android freezes a hidden tab without warning — save on the way out.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveRide();
});

DataSource.replay(buildMockRide());
// The mock ride is at Pennypack; if the saved area is elsewhere, show that
// area's map rather than the demo over a blank background.
if (region && OFFLINE.regionAt(...BASE) !== region) map.fitBounds(region.bounds);

// A ride saved in the last 12 hours comes back on load — the usual reason
// is a reload or Android killing the tab mid-ride. Connect carries on
// recording into it if the gap is short enough (LIVE_RESUME_MS).
if (RECORD) {
  RECORD.latest().then(saved => {
    if (!saved || Date.now() - saved.times[saved.times.length - 1] > 12 * 3600 * 1000) return;
    if (RIDE && RIDE.isLive) return;            // already connected; don't clobber
    stop();
    pinnedToNow = true;
    DataSource.replay(saved);
    scrub.value = RIDE.steps - 1; renderAt(RIDE.steps - 1);
    if (RIDE.base) followRegion(RIDE.base[0], RIDE.base[1]);
    setMode("SAVED RIDE", "");
    setStatus(`Recovered ${RECORD.rideName(saved)} from this phone. ` +
              "Connect radio to keep recording it, or ⬇ GPX to export.");
    updateExport();
  }).catch(() => {});
}

// Offline basemap: service worker + "Save map offline". Absent in the node
// tests (they stub the DOM and never load wolfpack-offline.js).
if (window.WolfpackOffline) {
  refreshSaved = window.WolfpackOffline.attach(document.getElementById("saveMap"),
                                               document.getElementById("offline"), () => region);
}
if (navigator.bluetooth) {
  setStatus("Showing a mock ride. Press “Connect radio” to go live (Chrome on Android, over HTTPS).");
} else {
  // Firefox and Safari have no Web Bluetooth at all — say so before the click fails.
  setStatus("Showing a mock ride. This browser can't talk to the radio (no Web Bluetooth) — " +
            "open this page in Chrome or Samsung Internet to go live.");
}
</script>
</body>
</html>
