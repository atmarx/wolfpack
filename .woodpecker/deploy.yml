# Internal staging: every push to main → wolfpack.dev.xram.net (xdocker01, LAN).
# Production is a web-v* tag — see deploy-production.yml.

when:
  - event: push
    branch: main

labels:
  host: xdocker01

depends_on:
  - build

steps:
  - name: deploy
    image: docker:cli
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apk add --no-cache git
      - git config --global --add safe.directory /projects/${CI_REPO_NAME}
      - |
        if [ ! -d /projects/${CI_REPO_NAME} ]; then
          git clone ${CI_REPO_CLONE_URL} /projects/${CI_REPO_NAME}
        fi
      - cd /projects/${CI_REPO_NAME}
      - git remote set-url origin ${CI_REPO_CLONE_URL}
      - git fetch origin
      # Fleet deploy standard (2026-08-10): never converge over a hot-patched
      # host tree.  Clean -> sync as before; dirty -> refuse with the diff in
      # the log so the edit is committed or discarded deliberately.  Untracked
      # files never block.  Precedent: mydoulapage 00c6072.
      - |
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "DEPLOY REFUSED: tracked files in $(pwd) were edited on the host."
          echo "Commit the change (or git checkout -- <file> to discard) and re-run."
          git status --short
          git diff HEAD
          exit 1
        fi
      - git checkout ${CI_COMMIT_BRANCH}
      - git reset --hard origin/${CI_COMMIT_BRANCH}
      - echo "$GITEA_TOKEN" | docker login -u ${CI_REPO_OWNER} --password-stdin git.dev.xram.net
      - cd deploy && docker compose pull && (docker rm -f wolfpack-app 2>/dev/null || true) && docker compose up -d
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/projects:/projects
