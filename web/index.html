<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Wolfpack — team map &amp; timelapse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#14171c; --panel:#1d222b; --ink:#e7ecf3; --muted:#8b94a3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
              font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  #map { flex:1; background:#0c0f14; }
  header { padding:8px 12px; background:var(--panel); display:flex; gap:14px;
           align-items:center; flex-wrap:wrap; border-bottom:1px solid #2a3140; }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.2px; }
  .badge { font-size:11px; color:#0c0f14; background:#f5c451; padding:2px 7px;
           border-radius:99px; font-weight:700; }
  .legend { display:flex; gap:10px; margin-left:auto; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  footer { padding:8px 12px; background:var(--panel); border-top:1px solid #2a3140;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  footer button { background:#2b3340; color:var(--ink); border:1px solid #3a4350;
                  border-radius:7px; padding:6px 12px; cursor:pointer; font-weight:600; }
  footer button:hover { background:#36404f; }
  #scrub { flex:1; min-width:160px; }
  .clock { font-variant-numeric:tabular-nums; color:var(--muted); min-width:118px; }
  #alerts { color:#ff8d8d; font-weight:600; min-width:120px; }
  #spread { color:var(--muted); font-variant-numeric:tabular-nums; }
  select { background:#2b3340; color:var(--ink); border:1px solid #3a4350; border-radius:7px; padding:5px; }
  .leaflet-tooltip.lbl { background:rgba(20,23,28,.85); border:none; color:#fff;
           font-weight:700; font-size:11px; box-shadow:none; }
  .basepin { font-size:12px; font-weight:700; color:#fff; white-space:nowrap;
             background:rgba(20,23,28,.8); padding:2px 7px; border-radius:6px;
             border:1px solid #4a5568; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐺 Wolfpack — team map &amp; timelapse</h1>
    <span class="badge" id="mode">MOCK DATA</span>
    <span class="legend" id="legend"></span>
  </header>
  <div id="map"></div>
  <footer>
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="0" value="0" />
    <span class="clock" id="clock">00:00 / 00:00</span>
    <select id="speed">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="4">4×</option>
    </select>
    <span id="alerts"></span>
    <span id="spread"></span>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Wolfpack phone map — Phase A (mock data, no hardware).
 * Demos the real ride shape: all 4 skill teams start at the one parking-lot
 * "base", fan out on different bearings (follow-the-leader, lead→tail strung
 * out), loop their own terrain, and converge back to base. Plus last-known/
 * greyed dots when a team branches out of range, and stop-status pills.
 * The only thing that changes for real data is the DataSource — swap the
 * mock ride for live positions over @meshtastic/js (BLE, Android) or a
 * replay log. Everything here is the stable Position API: id, name,
 * lat/lon, time. None of it needs our firmware module.
 * ------------------------------------------------------------------ */

// 4 teams = the 4 skill groups. Color is the handle; skill is the meaning.
const TEAMS = {
  R: { name: "Beginner",     color: "#e6394a" },
  Y: { name: "Intermediate", color: "#f5c451" },
  G: { name: "Proficient",   color: "#22c55e" },
  B: { name: "Advanced",     color: "#3b82f6" },
};
const ROLES = ["Lead", "Mid", "Tail"];
const ROLE_RADIUS = { Lead: 9, Mid: 7, Tail: 6 };
const STALE = "#6b7280";

const STEP_SECONDS = 10, STEPS = 180;          // 30-min ride
const BASE = [40.0520, -75.2110];              // trailhead / parking lot

// per-skill petal: a loop that LEAVES the base, bulges out on its own
// bearing, and returns — so all 4 teams fan out from the one parking lot
// in different directions and converge back. Beginners stay close;
// advanced range farthest (and is the team that branches off-mesh).
const PROFILE = {
  R: { dir:  15, Ra: 0.0050, Rb: 0.0040 },   // Beginner — N-ish, closest
  Y: { dir: 105, Ra: 0.0080, Rb: 0.0065 },   // Intermediate — E-ish
  G: { dir: 200, Ra: 0.0110, Rb: 0.0090 },   // Proficient — SSW
  B: { dir: 300, Ra: 0.0140, Rb: 0.0115 },   // Advanced — WNW, farthest out
};
const LAG = { Lead: 0, Mid: 7, Tail: 16 };   // tail trails lead along the petal

// scripted events (step windows) to show off the states
const ADV_OUT = [60, 120];                     // Advanced branches out of mesh range (far portion of its petal)
const INJURY  = ["R-Tail", 50, 100];           // Beginner tail hurt
const EQUIP   = ["G-Mid", 90, 140];            // Proficient mid mechanical

// --- helpers ---
const LNGS = 1.305;  // ~1/cos(40°): keep petals round-ish on the map at this lat
function petal(base, thetaDeg, Ra, Rb, a) {
  // closed loop that starts AND ends at `base`, bulging out along bearing theta.
  // a∈[0,2π]:  a=0 → base,  a=π → far point (~2·Ra out),  a=2π → base again.
  const th = thetaDeg * Math.PI / 180, ct = Math.cos(th), st = Math.sin(th);
  const out = -Math.cos(a) * Ra, side = Math.sin(a) * Rb;   // along / across bearing
  const lat = base[0] + Ra * ct + out * ct - side * st;
  const lng = base[1] + LNGS * (Ra * st + out * st + side * ct);
  return [lat, lng];
}
function haversine(a, b) {
  const R = 6371000, t = Math.PI / 180;
  const dLat = (b[0] - a[0]) * t, dLng = (b[1] - a[1]) * t;
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(s)));
}
function mmss(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// --- build the mock ride ---
function buildMockRide() {
  const nodes = [];
  const TWO_PI = 2 * Math.PI;
  for (const k in TEAMS) {
    const pr = PROFILE[k];
    for (const role of ROLES) {
      const id = k + "-" + role;
      // true position over time: one petal out from base and back, tail
      // trailing the lead. Clamped to [0,1] so the team gathers AT base at the
      // start and end — everyone leaves the lot and everyone returns to it.
      const truePos = [];
      for (let i = 0; i < STEPS; i++) {
        // normalize so even the tail completes its petal by the end — the lead
        // finishes early and waits at the lot while the tail rolls in.
        let f = (i - LAG[role]) / (STEPS - 1 - LAG.Tail);
        f = f < 0 ? 0 : f > 1 ? 1 : f;
        truePos.push(petal(BASE, pr.dir, pr.Ra, pr.Rb, f * TWO_PI));
      }
      // heard[] — Advanced team drops off-mesh mid-ride
      const heard = [];
      for (let i = 0; i < STEPS; i++) heard.push(!(k === "B" && i >= ADV_OUT[0] && i < ADV_OUT[1]));
      // status[]
      const status = [];
      for (let i = 0; i < STEPS; i++) {
        if (id === INJURY[0] && i >= INJURY[1] && i < INJURY[2]) status.push("injury");
        else if (id === EQUIP[0] && i >= EQUIP[1] && i < EQUIP[2]) status.push("equipment");
        else status.push(null);
      }
      // shown position + age from last-heard (the "last-known" behaviour)
      const shown = [], age = [], lastHeard = [];
      let li = 0;
      for (let i = 0; i < STEPS; i++) {
        if (heard[i]) li = i;
        lastHeard.push(li);
        shown.push(truePos[li]);
        age.push((i - li) * STEP_SECONDS);
      }
      nodes.push({ id, short: k + "-" + role, team: k, role,
                   skill: TEAMS[k].name, color: TEAMS[k].color,
                   truePos, shown, age, status, lastHeard });
    }
  }
  return { nodes };
}

// --- map ---
const map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", {
  maxZoom: 19, subdomains: "abcd", attribution: "© OpenStreetMap © CARTO",
}).addTo(map);

let RIDE = null;
const layers = {};

function buildLayers() {
  Object.values(layers).forEach(l => { l.marker.remove(); l.trail.remove(); });
  for (const k in layers) delete layers[k];
  const bounds = [BASE];

  // trailhead / base anchor
  L.marker(BASE, { icon: L.divIcon({ className: "", html:
      '<div class="basepin">🏁 Base</div>', iconSize: [54, 18], iconAnchor: [27, 9] }) })
    .addTo(map);

  RIDE.nodes.forEach(node => {
    const trail = L.polyline([], { color: node.color, weight: 2.5, opacity: 0.5 }).addTo(map);
    const marker = L.circleMarker(node.shown[0], {
      radius: ROLE_RADIUS[node.role], color: "#0c0f14", weight: 1.4,
      fillColor: node.color, fillOpacity: 0.9,
    }).addTo(map);
    if (node.role === "Lead") {
      marker.bindTooltip(node.skill, { permanent: true, direction: "right",
                                       className: "lbl", offset: [7, 0] });
    } else {
      marker.bindTooltip(node.short, { direction: "top", className: "lbl" });
    }
    layers[node.id] = { marker, trail };
    node.truePos.forEach(p => bounds.push(p));
  });
  map.fitBounds(bounds, { padding: [40, 40] });
}

function renderAt(i) {
  if (!RIDE) return;
  const alerts = [];
  RIDE.nodes.forEach(node => {
    const l = layers[node.id];
    const shown = node.shown[i], age = node.age[i], st = node.status[i], heard = age === 0;
    l.marker.setLatLng(shown);
    // styling: status ring > stale > normal
    let stroke = "#0c0f14", weight = 1.4;
    if (st === "injury") { stroke = "#ff3b3b"; weight = 3; }
    else if (st === "equipment") { stroke = "#f5c451"; weight = 2.6; }
    else if (!heard) { stroke = "#9aa4b2"; weight = 1; }
    l.marker.setStyle({
      fillColor: heard ? node.color : STALE, color: stroke, weight,
      fillOpacity: heard ? (node.role === "Lead" ? 0.95 : node.role === "Mid" ? 0.8 : 0.6) : 0.35,
    });
    l.trail.setLatLngs(node.truePos.slice(0, node.lastHeard[i] + 1));
    l.trail.setStyle({ opacity: heard ? 0.5 : 0.18 });
    if (node.role !== "Lead") {
      let tip = node.short + " · " + node.skill + " " + node.role;
      if (st) tip += "  ⚠ " + st;
      if (age > 0) tip += "  (" + age + "s ago)";
      l.marker.setTooltipContent(tip);
    }
    if (st) alerts.push("⚠ " + node.skill + "-" + node.role + " " + st.toUpperCase());
  });

  // footer: spread per in-range team, or out-of-range note
  const spreads = [];
  for (const k in TEAMS) {
    const lead = RIDE.nodes.find(n => n.team === k && n.role === "Lead");
    const tail = RIDE.nodes.find(n => n.team === k && n.role === "Tail");
    if (!lead || !tail) continue;
    const stale = RIDE.nodes.some(n => n.team === k && n.age[i] > 0);
    spreads.push(TEAMS[k].name + " " + (stale ? "⚠out-of-range" : haversine(lead.shown[i], tail.shown[i]) + "m"));
  }
  document.getElementById("clock").textContent =
    mmss(i * STEP_SECONDS) + " / " + mmss((STEPS - 1) * STEP_SECONDS);
  document.getElementById("alerts").textContent = alerts.join("   ");
  document.getElementById("spread").textContent = spreads.join("  ·  ");
}

function buildLegend() {
  document.getElementById("legend").innerHTML = Object.keys(TEAMS).map(p =>
    `<span><i class="dot" style="background:${TEAMS[p].color}"></i>${TEAMS[p].name}</span>`
  ).join("") + `<span><i class="dot" style="background:${STALE}"></i>out-of-range</span>`;
}

// --- timeline ---
const scrub = document.getElementById("scrub"), playBtn = document.getElementById("play");
let timer = null;
scrub.addEventListener("input", () => renderAt(+scrub.value));
playBtn.addEventListener("click", () => timer ? stop() : play());
function play() {
  playBtn.textContent = "⏸ Pause";
  const inc = +document.getElementById("speed").value;
  timer = setInterval(() => {
    let v = +scrub.value + inc;
    if (v >= STEPS) v = 0;
    scrub.value = v; renderAt(v);
  }, 200);
}
function stop() { clearInterval(timer); timer = null; playBtn.textContent = "▶ Play"; }

// --- DATA SOURCE: the one seam between mock and real ---
const DataSource = {
  replay(ride) {
    RIDE = ride;
    scrub.max = STEPS - 1; scrub.value = 0;
    buildLayers(); buildLegend(); renderAt(0);
  },
  // TODO (Phase B, when hardware lands — Android / Web Bluetooth confirmed):
  //   import { Client } from "https://cdn.jsdelivr.net/npm/@meshtastic/js/+esm";
  //   const conn = await new Client().createBleConnection(); ...
  //   conn.events.onPositionPacket.subscribe(p => store.appendFix(nodeId,[lat,lng],p.data.time));
  // Match p.from to a node by short-name prefix; team color = prefix (R/Y/G/B);
  // stale/last-known + status pills are already wired — live data just feeds them.
  async connectLive() {
    document.getElementById("mode").textContent = "LIVE (not wired yet)";
    throw new Error("connectLive() is stubbed — wire @meshtastic/js when hardware lands.");
  },
};

DataSource.replay(buildMockRide());
</script>
</body>
</html>
